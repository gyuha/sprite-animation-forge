version: '3'

vars:
  FORGE: sprite-animation-forge/scripts/forge.py

tasks:
  default:
    desc: 사용 가능한 작업 목록
    cmds:
      - task --list
    silent: true

  sync:
    desc: 의존성 설치 (uv sync)
    cmds:
      - uv sync

  test:
    desc: 전체 테스트 (live 제외, 약 100초)
    cmds:
      - uv run pytest -m "not live" -q

  test:quick:
    desc: 파이프라인·단위 테스트만 빠르게 (CLI subprocess 테스트 제외)
    cmds:
      - uv run pytest -q -k "not cli and not scenario and not determinism and not codex_commands"

  test:scenario:
    desc: 인수 시나리오 1~6
    cmds:
      - uv run pytest -v -k scenario

  test:determinism:
    desc: 결정성 테스트
    cmds:
      - uv run pytest -q -k determinism

  test:live:
    desc: 실제 Codex 계약 테스트 (사용량 소모, 로그인 필요)
    prompt: 실제 Codex를 호출하고 ChatGPT 사용량을 소모합니다. 계속할까요?
    cmds:
      - uv run pytest -m live -v

  doctor:
    desc: Codex·Python 의존성 사전 점검
    cmds:
      - uv run python {{.FORGE}} doctor

  forge:
    desc: "forge.py 직접 실행. 예: task forge -- status hero --root ./sprites"
    cmds:
      - uv run python {{.FORGE}} {{.CLI_ARGS}}
