[project]
name = "sprite-animation-forge"
version = "0.1.0"
description = "Post-processing core and CLI for AI-generated sprite sheets"
requires-python = ">=3.11"
dependencies = [
    "Pillow",
    "numpy",
    "scipy",
    "jsonschema",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
# sprite_forge is not pip-installed; it is imported via sys.path (docs/01 §6).
package = false

[tool.pytest.ini_options]
testpaths = ["sprite-animation-forge/tests"]
pythonpath = ["sprite-animation-forge/scripts"]
addopts = "-m 'not live'"
markers = [
    "live: calls the real Codex CLI (slow, consumes usage); run with -m live",
]
