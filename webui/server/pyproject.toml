[project]
name = "sprite-forge-web"
version = "0.1.0"
description = "Web UI backend (FastAPI) for sprite-animation-forge"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "python-multipart",
]

[project.scripts]
sprite-forge-web = "sprite_forge_web.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sprite_forge_web"]
